[pytest]
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    smoke: quick checks
    regression: full regression suite
    contract: API schema/contract tests
    negative: negative/error-path tests
    idempotency: idempotency/retry behavior checks
    ratelimit: rate-limit behavior checks
    property: property-based tests with Hypothesis
