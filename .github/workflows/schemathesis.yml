name: Schemathesis (Allure Artifact)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  schemathesis:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: http://localhost:8000
      BASE_URL: http://localhost:8000
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install .; fi
          python -m pip install schemathesis allure-pytest

      - name: Compose up & wait for API
        run: |
          docker compose -f local-api/docker-compose.api.yml up -d --build
          echo "Waiting for API on :8000 ..."
          for i in $(seq 1 60); do
            curl -sSf http://localhost:8000/health >/dev/null && break || true
            curl -sSf http://localhost:8000/openapi.json >/dev/null && break || true
            sleep 2
          done
          curl -sS http://localhost:8000/openapi.json >/dev/null || {
            echo "::error::API failed to start. Logs:"
            docker compose -f local-api/docker-compose.api.yml ps
            docker compose -f local-api/docker-compose.api.yml logs --no-color --tail=200 api || true
            exit 1
          }

      - name: Write dynamic schemathesis test (robust loader)
        run: |
          python - <<'PY'
          import os, pathlib, textwrap
          p = pathlib.Path("tests/test_schemathesis_dynamic.py")
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(textwrap.dedent("""
          import os
          import requests
          import schemathesis as st

          BASE = os.getenv("BASE_URL", "http://localhost:8000")
          URL = f"{BASE}/openapi.json"

          def _schema_from_uri(url: str):
              # Try legacy top-level API
              if hasattr(st, "from_uri"):
                  return st.from_uri(url)
              # Try module-scoped APIs
              openapi = getattr(st, "openapi", None)
              if openapi is not None:
                  if hasattr(openapi, "from_uri"):
                      return openapi.from_uri(url)
                  if hasattr(openapi, "from_url"):
                      return openapi.from_url(url)
                  if hasattr(openapi, "from_dict"):
                      data = requests.get(url, timeout=30).json()
                      return openapi.from_dict(data)
              # Fallback to top-level from_dict if available
              if hasattr(st, "from_dict"):
                  data = requests.get(url, timeout=30).json()
                  return st.from_dict(data)
              raise RuntimeError("Unsupported Schemathesis version; no compatible loader found.")

          schema = _schema_from_uri(URL)

          @schema.parametrize()
          def test_api(case):
              case.call_and_validate()
          """))
          PY


      - name: Run Schemathesis → Allure
        run: |
          mkdir -p allure-results/schemathesis
          pytest -q tests/test_schemathesis_dynamic.py --alluredir=allure-results/schemathesis

      - name: Upload Allure results (schemathesis)
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-schemathesis
          path: allure-results/schemathesis
          if-no-files-found: error
