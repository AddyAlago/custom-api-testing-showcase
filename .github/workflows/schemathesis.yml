name: Schemathesis (Allure Artifact)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  schemathesis:
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://localhost:8000
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install .; fi
          pip install schemathesis allure-pytest

      - name: Start services (docker compose if present)
        run: |
          if [ -f docker-compose.yml ] || [ -f compose.yaml ] || [ -f compose.yml ]; then
            docker compose up -d
            echo "Waiting for service to be ready..."
            for i in $(seq 1 30); do
              if curl -sSf "$BASE_URL/openapi.json" > /dev/null; then
                echo "OpenAPI ready."
                break
              fi
              sleep 2
            done
          fi

      - name: Generate minimal schemathesis test if none exists
        run: |
          mkdir -p tests
          if [ ! -f tests/test_schemathesis_dynamic.py ]; then
            cat > tests/test_schemathesis_dynamic.py <<'PY'
            import os
            import schemathesis as st

            BASE = os.getenv("BASE_URL", "http://localhost:8000")
            schema = st.from_uri(f"{BASE}/openapi.json")

            @schema.parametrize()
            def test_api(case):
                case.call_and_validate()
            PY
          fi

      - name: Run Schemathesis → Allure
        env:
          BASE_URL: ${{ env.BASE_URL }}
        run: |
          mkdir -p allure-results/schemathesis
          pytest -q -k "schemathesis or test_schemathesis_dynamic" --alluredir=allure-results/schemathesis ||           pytest -q tests/test_schemathesis_dynamic.py --alluredir=allure-results/schemathesis

      - name: Upload Allure results (schemathesis)
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-schemathesis
          path: allure-results/schemathesis
          if-no-files-found: error
