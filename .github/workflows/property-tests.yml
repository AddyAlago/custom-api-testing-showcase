name: Property Tests (Allure Artifact)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  property-tests:
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://localhost:8000
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install .; fi
          python - << 'PY'
          import sys, subprocess
          try:
              import allure_pytest  # noqa: F401
          except Exception:
              subprocess.check_call([sys.executable, "-m", "pip", "install", "allure-pytest"])
          PY

      - name: Start services (docker compose if present)
        run: |
          if [ -f docker-compose.yml ] || [ -f compose.yaml ] || [ -f compose.yml ]; then
            docker compose up -d
            echo "Waiting for service to be ready..."
            for i in $(seq 1 30); do
              if curl -sSf http://localhost:8000/ > /dev/null; then
                echo "Service ready."
                break
              fi
              sleep 2
            done
          else
            echo "No compose file; assuming BASE_URL is reachable."
          fi

      - name: Run Pytest (Property) → Allure
        run: |
          mkdir -p allure-results/property
          if [ -d tests/property ]; then
            pytest -q tests/property --alluredir=allure-results/property
          else
            # fallback if property tests are mixed; use marker if available
            pytest -q -m property --alluredir=allure-results/property || true
          fi

      - name: Upload Allure results (property)
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-property
          path: allure-results/property
          if-no-files-found: error
