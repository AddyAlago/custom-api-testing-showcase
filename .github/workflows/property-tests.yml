name: QA • Property Tests

on:
  push: { branches: [ main ] }
  pull_request:
  workflow_dispatch:

jobs:
  property-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Start mock API
        run: |
          docker compose up -d
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          # If your tests are a separate extra, ensure hypothesis is present:
          python -m pip install hypothesis

      - name: Run property tests (non-gating, Allure-friendly)
        run: |
          mkdir -p allure-results-property
          set +e
          pytest -q tests/property --alluredir=allure-results-property
          EC=$?
          set -e
          echo "pytest exit code: $EC (ignored for showcase)"

      - name: Upload Allure artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-api-property
          path: allure-results-property/**
