name: Property Tests (Allure Artifact)
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  property-tests:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: http://localhost:8000
      BASE_URL: http://localhost:8000
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install .; fi
          python -m pip install allure-pytest

      - name: Compose up & wait for API
        run: |
          docker compose -f local-api/docker-compose.api.yml up -d --build
          echo "Waiting for API on :8000 ..."
          for i in $(seq 1 60); do
            curl -sSf http://localhost:8000/health >/dev/null && break || true
            curl -sSf http://localhost:8000/openapi.json >/dev/null && break || true
            sleep 2
          done
          curl -sS http://localhost:8000/openapi.json >/dev/null || {
            echo "::error::API failed to start. Logs:"
            docker compose -f local-api/docker-compose.api.yml ps
            docker compose -f local-api/docker-compose.api.yml logs --no-color --tail=200 api || true
            exit 1
          }

      - name: Run Pytest (Property) → Allure
        run: |
          mkdir -p allure-results/property
          if [ -d tests/property ]; then
            pytest -q tests/property --base-url="$API_BASE_URL" --alluredir=allure-results/property
          else
            pytest -q -m property --base-url="$API_BASE_URL" --alluredir=allure-results/property || true
          fi

      - name: Upload Allure results (property)
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-property
          path: allure-results/property
          if-no-files-found: error
