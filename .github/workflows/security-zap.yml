name: Security • ZAP Baseline

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"   # Mondays at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write    # needed for publishing with gh-pages action

jobs:
  zap-baseline:
    name: Run ZAP Baseline & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: api-zap-pages
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start mock API (Docker Compose)
        run: |
          docker compose up -d
          echo "Waiting for mock API..."
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "Mock API is up."
              break
            fi
            sleep 2
          done

      - name: Run ZAP Baseline scan (do not fail job)
        env:
          ZAP_TARGET: http://localhost:8000/docs   # start from a 200 page (FastAPI docs)
        run: |
          # Ensure the mounted directory is writable by the container
          rm -rf zap-report
          mkdir -p zap-report
          chmod 777 zap-report

          # Run ZAP but never fail the step/job
          set +e
          docker run --rm --network=host \
            -u 0:0 \
            -v "$PWD/zap-report:/zap/wrk" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t "${ZAP_TARGET}" \
            -r zap-report.html \
            -x zap-report.xml \
            -m 5 \
            -a
          ZAP_EC=$?
          set -e

          # Provide a stable landing page for GH Pages (/zap/)
          cp zap-report/zap-report.html zap-report/index.html || true

          echo "ZAP baseline exit code: ${ZAP_EC} (0=PASS, 1=FAIL, 2=WARN). Continuing regardless."

      - name: Upload ZAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: zap-report/**

      - name: Publish report to gh-pages (/zap/)
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./zap-report
          destination_dir: zap
          force_orphan: false

      - name: Ensure /zap/index.html
        if: always()
        run: |
          if [ -f "zap-report/index.html" ]; then
            mkdir -p _zap
            cp zap-report/index.html _zap/index.html
          fi

      - name: Deploy index helper (ensures /zap/index.html)
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_zap
          destination_dir: zap
          force_orphan: false

      - name: Summary links
        if: always()
        run: |
          echo "### 🔐 ZAP Baseline" >> $GITHUB_STEP_SUMMARY
          echo "- Report: https://addyalago.github.io/custom-api-testing-showcase/zap/" >> $GITHUB_STEP_SUMMARY
