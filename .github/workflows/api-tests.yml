name: API Tests (Allure Artifact)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://localhost:8000
      API_BASE_URL: http://localhost:8000
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install .; fi
          python - << 'PY'
          import sys, subprocess
          try:
              import allure_pytest  # noqa: F401
          except Exception:
              subprocess.check_call([sys.executable, "-m", "pip", "install", "allure-pytest"])
          PY

      - name: Start services (docker compose if present)
        run: |
          if [ -f docker-compose.yml ] || [ -f compose.yaml ] || [ -f compose.yml ]; then
            docker compose up -d
            echo "Waiting for service to be ready..."
            for i in $(seq 1 30); do
              if curl -sSf "$BASE_URL/health" > /dev/null; then
                echo "Service ready."
                break
              fi
              sleep 2
            done
          else
            echo "No compose file; assuming BASE_URL is reachable."
          fi

      - name: Run Pytest (API) → Allure
        env:
          BASE_URL: ${{ env.BASE_URL }}
          API_BASE_URL: ${{ env.API_BASE_URL }}
        run: |
          mkdir -p allure-results/api
          pytest -q --base-url="$API_BASE_URL" -k "not schemathesis and not property" --alluredir=allure-results/api

      - name: Upload Allure results (api)
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: allure-results/api
          if-no-files-found: error
