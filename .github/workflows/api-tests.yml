name: API tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  run-matrix:
    name: Run ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: contract
            marker: contract
          - suite: negative
            marker: negative
          - suite: idempotency
            marker: idempotency
          - suite: ratelimit
            marker: ratelimit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests jsonschema allure-pytest python-dotenv

      - name: Start local API
        working-directory: local-api
        env:
          RATE_LIMIT_PER_MIN: "10"   # keeps ratelimit suite quick in CI
        run: docker compose -f docker-compose.api.yml up -d --build

      - name: Wait for API /health
        run: |
          for i in {1..60}; do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 1
          done
          echo "API did not start in time" && exit 1

      - name: Run pytest (${{ matrix.suite }})
        env:
          API_BASE_URL: http://localhost:8000
          RATE_LIMIT_ENDPOINT: /ratelimit
        run: |
          mkdir -p allure-results
          cat > allure-results/executor.json <<'JSON'
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "API • ${{ matrix.suite }} • #${{ github.run_number }}",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportName": "API • ${{ matrix.suite }}"
          }
          JSON
          pytest -m "${{ matrix.marker }}" --alluredir=allure-results -q || true

      - name: Upload Allure results (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-api-${{ matrix.suite }}
          path: allure-results
          if-no-files-found: warn
          retention-days: 14

      - name: Stop local API
        if: always()
        working-directory: local-api
        run: docker compose -f docker-compose.api.yml down
